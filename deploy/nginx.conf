server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /app/public;
    index index.php;
    client_max_body_size 8M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|ico|svg|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri /index.php$is_args$args;
    }
}

# Rota do Condomínio (/opt/rota-condominio)
server {
    listen 80;
    listen 443 ssl;
    server_name rota.jbfsi.com.br;
    # trocar pelo Origin Certificate de rota.jbfsi.com.br antes de usar Full (strict)
    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # envio dos vídeos de anúncio
    client_max_body_size 55m;

    # resolve em tempo de requisição: o nginx sobe mesmo com o rota parado
    resolver 127.0.0.11 valid=10s;

    location / {
        set $rota_upstream http://rota-web:80;
        proxy_pass $rota_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
